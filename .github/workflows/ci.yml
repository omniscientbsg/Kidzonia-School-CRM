name: CI

on:
  push:
  pull_request:
  # The release workflow runs these same checks before building an image.
  workflow_call:

concurrency:
  # The workflow name keeps a release's call of these checks from cancelling
  # (or being cancelled by) the ordinary CI run for the same tag.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kidzonia
          POSTGRES_PASSWORD: kidzonia
          POSTGRES_DB: kidzonia
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U kidzonia -d kidzonia"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://kidzonia:kidzonia@localhost:55432/kidzonia
      TEST_DATABASE_URL: postgresql://kidzonia:kidzonia@localhost:55432/kidzonia_test
      E2E_DATABASE_URL: postgresql://kidzonia:kidzonia@localhost:55432/kidzonia_e2e
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, so the migration check can compare with the base commit.
          fetch-depth: 0
      - name: Committed migrations are never edited
        run: node scripts/check-migrations.mjs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # S3-compatible storage for the S3 driver's tests (same image and config as docker-compose).
      - name: Start S3 (SeaweedFS)
        run: >-
          docker run -d --name s3 -p 59000:8333
          -v ${{ github.workspace }}/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
          chrislusf/seaweedfs:4.47
          server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @kidzonia/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t kidzonia-360:ci .
