name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kidzonia
          POSTGRES_PASSWORD: kidzonia
          POSTGRES_DB: kidzonia
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U kidzonia -d kidzonia"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://kidzonia:kidzonia@localhost:55432/kidzonia
      TEST_DATABASE_URL: postgresql://kidzonia:kidzonia@localhost:55432/kidzonia_test
      E2E_DATABASE_URL: postgresql://kidzonia:kidzonia@localhost:55432/kidzonia_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @kidzonia/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t kidzonia-360:ci .
