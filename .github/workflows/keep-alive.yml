# Keeps the Render free-tier service awake.
#
# Render spins a free web service down after 15 minutes without a request, and
# the next visitor then waits ~50 seconds for a cold start. This pings the
# health endpoint every 10 minutes so the instance never idles out.
#
# It doubles as an uptime check: a non-200 fails the run and GitHub emails you.
#
# HONEST LIMITS:
#   * GitHub disables scheduled workflows after 60 days with no repo activity.
#     One commit resets that clock; a dormant repo will silently stop pinging.
#   * Cron here is best-effort. GitHub delays scheduled jobs under load, so a
#     10-minute schedule can land 15+ minutes apart and the service may still
#     nap occasionally. If that matters, use Render's own paid cron job, an
#     uptime monitor, or a paid Render plan (which never sleeps).
#   * Free tier gives 750 instance-hours a month. Awake 24/7 is ~730, so this
#     consumes essentially the whole free allowance on one service.

name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Never let two pings overlap if one run is slow.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          # Set this in: repo Settings -> Secrets and variables -> Actions ->
          # Variables -> New repository variable. Example:
          #   https://kidzonia-school-crm.onrender.com
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "RENDER_APP_URL repository variable is not set — nothing to ping."
            echo "Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          # --max-time covers a cold start: a sleeping instance can take ~50s
          # to answer, and that request is exactly what wakes it.
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 90 --retry 2 --retry-delay 15 "$APP_URL/api/health")
          echo "GET $APP_URL/api/health -> $code"
          cat /tmp/body.txt
          echo

          if [ "$code" != "200" ]; then
            echo "::error::Health check failed with HTTP $code"
            exit 1
          fi
