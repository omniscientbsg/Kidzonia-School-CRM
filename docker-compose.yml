name: kidzonia360

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kidzonia
      POSTGRES_PASSWORD: kidzonia
      POSTGRES_DB: kidzonia
    ports:
      # A non-default host port so this doesn't clash with other local Postgres instances.
      - '55432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kidzonia -d kidzonia']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible storage, so the S3 file driver is tested for real (locally and in CI).
  # SeaweedFS rather than MinIO: MinIO no longer publishes public container images.
  s3:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '59000:8333'
    volumes:
      - s3-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  db-data:
  s3-data:
